name: Production Crons

on:
  schedule:
    # Every 10 minutes: Alert on any stuck / stalled BullMQ study-pack generation jobs
    - cron: '*/10 * * * *'
    # Every Sunday at 23:55 UTC: Finalize leaderboard scores and assign 7-day winner boosts
    - cron: '55 23 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Manually trigger a cron job'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - check-stalled-jobs
          - finalize-weekly-scores

jobs:
  execute-crons:
    runs-on: ubuntu-latest
    steps:
      - name: Check Stalled Jobs
        if: github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *' || github.event.inputs.job == 'check-stalled-jobs' || github.event.inputs.job == 'all'
        run: |
          echo "Triggering check-stalled-jobs..."
          RESPONSE=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}\n" -X GET "${{ secrets.NEXT_PUBLIC_APP_URL || secrets.APP_URL }}/api/cron/check-stalled-jobs" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Request failed with status $STATUS"
            exit 1
          fi

      - name: Finalize Weekly Scores
        if: github.event_name == 'schedule' && github.event.schedule == '55 23 * * 0' || github.event.inputs.job == 'finalize-weekly-scores' || github.event.inputs.job == 'all'
        run: |
          echo "Triggering finalize-weekly-scores..."
          RESPONSE=$(curl -sSL -w "\nHTTP_STATUS:%{http_code}\n" -X GET "${{ secrets.NEXT_PUBLIC_APP_URL || secrets.APP_URL }}/api/cron/finalize-weekly-scores" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Request failed with status $STATUS"
            exit 1
          fi
